name: Security - Supply Chain & Vulnerability Audit

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  schedule:
    # Run weekly security scan on Mondays at 04:00 UTC
    - cron: '0 4 * * 1'

permissions:
  contents: read
  security-events: write

concurrency:
  group: sec-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supply-chain-security:
    name: Supply Chain Security (Trivy & SBOM)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local container image for vulnerability scan
        run: |
          if [ -f "src/main.ts" ]; then
            docker build -t wagering-processor:${{ github.sha }} .
          else
            echo "Skipping container build (src/main.ts not present yet)"
          fi

      - name: Scan Filesystem & Dependencies with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: 0

      - name: Scan Container Image with Trivy
        if: hashFiles('src/main.ts') != ''
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: wagering-processor:${{ github.sha }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: 0

      - name: Generate Software Bill of Materials (SBOM in SPDX format)
        if: hashFiles('src/main.ts') != ''
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: wagering-processor:${{ github.sha }}
          format: 'spdx-json'
          output: 'sbom-spdx.json'

      - name: Upload SBOM Artifact
        if: hashFiles('src/main.ts') != ''
        uses: actions/upload-artifact@v7
        with:
          name: sbom-spdx-${{ github.sha }}
          path: sbom-spdx.json

