<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 480" width="100%" height="100%">
  <defs>
    <marker id="int-req-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#334155" />
    </marker>
    <marker id="int-resp-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#334155" />
    </marker>
    <filter id="card-shadow" x="-4%" y="-8%" width="108%" height="124%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
  </defs>

  <style>
    .actor-card { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; rx: 6; ry: 6; filter: url(#card-shadow); }
    .actor-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #0f172a; text-anchor: middle; }
    .actor-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 400; fill: #64748b; text-anchor: middle; }
    .lifeline { stroke: #cbd5e1; stroke-width: 1.2; stroke-dasharray: 4 4; }
    
    .req-line { stroke: #334155; stroke-width: 1.4; }
    .resp-line { stroke: #334155; stroke-width: 1.4; stroke-dasharray: 4 4; }
    
    .req-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10.5px; font-weight: 500; fill: #0f172a; }
    .resp-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10.5px; font-weight: 400; fill: #334155; }
    
    .badge-201 { fill: #dcfce7; stroke: #86efac; stroke-width: 1; rx: 4; ry: 4; }
    .badge-201-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 9px; font-weight: 700; fill: #166534; text-anchor: middle; }
    
    .note-box { fill: #fffbeb; stroke: #fde68a; stroke-width: 1; rx: 4; ry: 4; }
    .note-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 9.5px; font-weight: 500; fill: #92400e; }
  </style>

  <!-- Background -->
  <rect width="950" height="480" fill="#ffffff" />

  <!-- Lifelines -->
  <line x1="90" y1="65" x2="90" y2="420" class="lifeline" />
  <line x1="280" y1="65" x2="280" y2="420" class="lifeline" />
  <line x1="490" y1="65" x2="490" y2="420" class="lifeline" />
  <line x1="700" y1="65" x2="700" y2="420" class="lifeline" />
  <line x1="870" y1="65" x2="870" y2="420" class="lifeline" />

  <!-- Top Actors -->
  <g>
    <rect x="20" y="15" width="140" height="45" class="actor-card" />
    <text x="90" y="34" class="actor-title">Game Provider</text>
    <text x="90" y="48" class="actor-sub">Cliente Externo</text>

    <rect x="210" y="15" width="140" height="45" class="actor-card" />
    <text x="280" y="34" class="actor-title">API Gateway</text>
    <text x="280" y="48" class="actor-sub">NestJS App</text>

    <rect x="420" y="15" width="140" height="45" class="actor-card" />
    <text x="490" y="34" class="actor-title">PostgreSQL</text>
    <text x="490" y="48" class="actor-sub">Pessimistic Lock &amp; Outbox</text>

    <rect x="630" y="15" width="140" height="45" class="actor-card" />
    <text x="700" y="34" class="actor-title">Outbox Publisher</text>
    <text x="700" y="48" class="actor-sub">Worker em Background</text>

    <rect x="800" y="15" width="140" height="45" class="actor-card" />
    <text x="870" y="34" class="actor-title">SQS FIFO</text>
    <text x="870" y="48" class="actor-sub">Fila com Particionamento</text>
  </g>

  <!-- Step 1: Request from Provider to Gateway -->
  <text x="185" y="93" class="req-text" text-anchor="middle">POST /transactions (idempotencyKey, BET, amount: 50)</text>
  <line x1="90" y1="100" x2="272" y2="100" class="req-line" marker-end="url(#int-req-arrow)" />

  <!-- Step 2: Gateway locks wallet in Postgres -->
  <text x="385" y="125" class="req-text" text-anchor="middle">SELECT wallet FOR UPDATE (Row Lock)</text>
  <line x1="280" y1="132" x2="482" y2="132" class="req-line" marker-end="url(#int-req-arrow)" />

  <!-- Step 3: Atomic Mutation and Outbox Insert -->
  <text x="385" y="165" class="req-text" text-anchor="middle">UPDATE balance, INSERT ledger &amp; outbox_messages</text>
  <line x1="280" y1="172" x2="482" y2="172" class="req-line" marker-end="url(#int-req-arrow)" />

  <text x="385" y="200" class="resp-text" text-anchor="middle">COMMIT TRANSACTION</text>
  <line x1="490" y1="207" x2="288" y2="207" class="resp-line" marker-end="url(#int-resp-arrow)" />

  <!-- Step 4: 201 Response to Provider -->
  <g transform="translate(100, 222)">
    <rect x="0" y="0" width="75" height="18" class="badge-201" />
    <text x="37" y="13" class="badge-201-txt">201 CREATED</text>
    <text x="82" y="13" class="resp-text">status: PROCESSED • balance: "450.00"</text>
  </g>
  <line x1="280" y1="245" x2="98" y2="245" class="resp-line" marker-end="url(#int-resp-arrow)" />

  <!-- Step 5: Background Outbox Publisher sweeps events -->
  <text x="595" y="280" class="req-text" text-anchor="middle">SELECT FOR UPDATE SKIP LOCKED</text>
  <line x1="700" y1="287" x2="498" y2="287" class="req-line" marker-end="url(#int-req-arrow)" />

  <text x="595" y="315" class="resp-text" text-anchor="middle">Batch de 50 eventos reivindicados</text>
  <line x1="490" y1="322" x2="692" y2="322" class="resp-line" marker-end="url(#int-resp-arrow)" />

  <!-- Step 6: Publish to SQS FIFO -->
  <text x="785" y="355" class="req-text" text-anchor="middle">SendMessage (MessageGroupId: walletId)</text>
  <line x1="700" y1="362" x2="862" y2="362" class="req-line" marker-end="url(#int-req-arrow)" />

  <text x="785" y="388" class="resp-text" text-anchor="middle">Ack com MessageId</text>
  <line x1="870" y1="395" x2="708" y2="395" class="resp-line" marker-end="url(#int-resp-arrow)" />

  <!-- Bottom Actors -->
  <g>
    <rect x="20" y="420" width="140" height="45" class="actor-card" />
    <text x="90" y="439" class="actor-title">Game Provider</text>
    <text x="90" y="453" class="actor-sub">Cliente Externo</text>

    <rect x="210" y="420" width="140" height="45" class="actor-card" />
    <text x="280" y="439" class="actor-title">API Gateway</text>
    <text x="280" y="453" class="actor-sub">NestJS App</text>

    <rect x="420" y="420" width="140" height="45" class="actor-card" />
    <text x="490" y="439" class="actor-title">PostgreSQL</text>
    <text x="490" y="453" class="actor-sub">Pessimistic Lock &amp; Outbox</text>

    <rect x="630" y="420" width="140" height="45" class="actor-card" />
    <text x="700" y="439" class="actor-title">Outbox Publisher</text>
    <text x="700" y="453" class="actor-sub">Worker em Background</text>

    <rect x="800" y="420" width="140" height="45" class="actor-card" />
    <text x="870" y="439" class="actor-title">SQS FIFO</text>
    <text x="870" y="453" class="actor-sub">Fila com Particionamento</text>
  </g>
</svg>
