<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 700" width="100%" height="100%">
  <defs>
    <marker id="wf-req-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#334155" />
    </marker>
    <marker id="wf-resp-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#334155" />
    </marker>
    <filter id="card-shadow" x="-4%" y="-8%" width="108%" height="124%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
  </defs>

  <style>
    .actor-card { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; rx: 8; ry: 8; filter: url(#card-shadow); }
    .actor-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #0f172a; text-anchor: middle; }
    .actor-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 400; fill: #64748b; text-anchor: middle; }
    .lifeline { stroke: #cbd5e1; stroke-width: 1.5; }
    
    .divider-pill { fill: #f1f5f9; stroke: #e2e8f0; stroke-width: 1; rx: 11; ry: 11; }
    .divider-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #475569; text-anchor: middle; }
    
    .req-line { stroke: #334155; stroke-width: 1.5; }
    .resp-line { stroke: #334155; stroke-width: 1.5; stroke-dasharray: 5 4; }
    
    .req-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; font-weight: 500; fill: #0f172a; text-anchor: middle; }
    .resp-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; font-weight: 400; fill: #334155; }
    
    .badge-201 { fill: #dcfce7; stroke: #86efac; stroke-width: 1; rx: 4; ry: 4; }
    .badge-201-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 700; fill: #166534; text-anchor: middle; }
    
    .badge-200 { fill: #dbeafe; stroke: #93c5fd; stroke-width: 1; rx: 4; ry: 4; }
    .badge-200-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 700; fill: #1e40af; text-anchor: middle; }
    
    .badge-422 { fill: #fee2e2; stroke: #fca5a5; stroke-width: 1; rx: 4; ry: 4; }
    .badge-422-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 9.5px; font-weight: 700; fill: #991b1b; text-anchor: middle; }
    
    .badge-202 { fill: #ede9fe; stroke: #c4b5fd; stroke-width: 1; rx: 4; ry: 4; }
    .badge-202-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 700; fill: #5b21b6; text-anchor: middle; }
  </style>

  <!-- Clean Background -->
  <rect width="850" height="700" fill="#ffffff" />

  <!-- Lifelines -->
  <line x1="160" y1="70" x2="160" y2="610" class="lifeline" />
  <line x1="690" y1="70" x2="690" y2="610" class="lifeline" />

  <!-- Top Actors -->
  <g>
    <rect x="60" y="20" width="200" height="50" class="actor-card" />
    <text x="160" y="41" class="actor-title">Seu Sistema</text>
    <text x="160" y="57" class="actor-sub">Game Provider (Cliente)</text>

    <rect x="590" y="20" width="200" height="50" class="actor-card" />
    <text x="690" y="41" class="actor-title">Wagering Public API</text>
    <text x="690" y="57" class="actor-sub">Distributed Gateway (Servidor)</text>
  </g>

  <!-- ================= SCENARIO 1: HAPPY PATH BET ================= -->
  <rect x="300" y="90" width="250" height="22" class="divider-pill" />
  <text x="425" y="105" class="divider-text">1. Liquidação de Aposta (Happy Path)</text>

  <!-- Step 1 Request -->
  <text x="425" y="132" class="req-text">POST /v1/api/wagering/transactions (kind: BET, amount: "50.00", currency: BRL)</text>
  <line x1="160" y1="140" x2="682" y2="140" class="req-line" marker-end="url(#wf-req-arrow)" />

  <!-- Step 1 Response -->
  <g transform="translate(180, 162)">
    <rect x="0" y="0" width="90" height="20" class="badge-201" />
    <text x="45" y="14" class="badge-201-txt">201 CREATED</text>
    <text x="100" y="14" class="resp-text">Aposta liquidada • balance: "450.00" • status: PROCESSED</text>
  </g>
  <line x1="690" y1="190" x2="168" y2="190" class="resp-line" marker-end="url(#wf-resp-arrow)" />

  <!-- ================= SCENARIO 2: IDEMPOTENT REPLAY ================= -->
  <rect x="305" y="215" width="240" height="22" class="divider-pill" />
  <text x="425" y="230" class="divider-text">2. Retry Idempotente de Rede</text>

  <!-- Step 2 Request -->
  <text x="425" y="257" class="req-text">POST /v1/api/wagering/transactions (mesmo idempotencyKey / replay seguro)</text>
  <line x1="160" y1="265" x2="682" y2="265" class="req-line" marker-end="url(#wf-req-arrow)" />

  <!-- Step 2 Response -->
  <g transform="translate(205, 287)">
    <rect x="0" y="0" width="65" height="20" class="badge-200" />
    <text x="32" y="14" class="badge-200-txt">200 OK</text>
    <text x="75" y="14" class="resp-text">Replay idempotente seguro • idempotentReplay: true</text>
  </g>
  <line x1="690" y1="315" x2="168" y2="315" class="resp-line" marker-end="url(#wf-resp-arrow)" />

  <!-- ================= SCENARIO 3: INSUFFICIENT FUNDS ================= -->
  <rect x="295" y="340" width="260" height="22" class="divider-pill" />
  <text x="425" y="355" class="divider-text">3. Rejeição por Saldo Insuficiente</text>

  <!-- Step 3 Request -->
  <text x="425" y="382" class="req-text">POST /v1/api/wagering/transactions (BET com valor superior ao saldo disponível)</text>
  <line x1="160" y1="390" x2="682" y2="390" class="req-line" marker-end="url(#wf-req-arrow)" />

  <!-- Step 3 Response -->
  <g transform="translate(170, 412)">
    <rect x="0" y="0" width="130" height="20" class="badge-422" />
    <text x="65" y="14" class="badge-422-txt">422 UNPROCESSABLE</text>
    <text x="140" y="14" class="resp-text">status: REJECTED • failureCode: INSUFFICIENT_FUNDS</text>
  </g>
  <line x1="690" y1="440" x2="168" y2="440" class="resp-line" marker-end="url(#wf-resp-arrow)" />

  <!-- ================= SCENARIO 4: OUT-OF-ORDER REVERSAL ================= -->
  <rect x="285" y="465" width="280" height="22" class="divider-pill" />
  <text x="425" y="480" class="divider-text">4. Reversão Antecipada (Out-of-Order)</text>

  <!-- Step 4 Request -->
  <text x="425" y="507" class="req-text">POST /v1/api/wagering/transactions (REFUND de aposta que ainda não chegou)</text>
  <line x1="160" y1="515" x2="682" y2="515" class="req-line" marker-end="url(#wf-req-arrow)" />

  <!-- Step 4 Response -->
  <g transform="translate(170, 537)">
    <rect x="0" y="0" width="105" height="20" class="badge-202" />
    <text x="52" y="14" class="badge-202-txt">202 ACCEPTED</text>
    <text x="115" y="14" class="resp-text">status: PENDING_REFERENCE • reconciliado após chegada do BET</text>
  </g>
  <line x1="690" y1="565" x2="168" y2="565" class="resp-line" marker-end="url(#wf-resp-arrow)" />

  <!-- Bottom Actors -->
  <g>
    <rect x="60" y="610" width="200" height="50" class="actor-card" />
    <text x="160" y="631" class="actor-title">Seu Sistema</text>
    <text x="160" y="647" class="actor-sub">Game Provider (Cliente)</text>

    <rect x="590" y="610" width="200" height="50" class="actor-card" />
    <text x="690" y="631" class="actor-title">Wagering Public API</text>
    <text x="690" y="647" class="actor-sub">Distributed Gateway (Servidor)</text>
  </g>
</svg>
