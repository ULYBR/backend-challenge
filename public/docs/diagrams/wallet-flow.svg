<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <defs>
    <marker id="wf-req-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#334155" />
    </marker>
    <marker id="wf-resp-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#334155" />
    </marker>
    <filter id="card-shadow" x="-4%" y="-8%" width="108%" height="124%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
  </defs>

  <style>
    .actor-card { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; rx: 8; ry: 8; filter: url(#card-shadow); }
    .actor-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #0f172a; text-anchor: middle; }
    .actor-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 400; fill: #64748b; text-anchor: middle; }
    .lifeline { stroke: #cbd5e1; stroke-width: 1.5; }
    
    .divider-pill { fill: #f1f5f9; stroke: #e2e8f0; stroke-width: 1; rx: 11; ry: 11; }
    .divider-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #475569; text-anchor: middle; }
    
    .req-line { stroke: #334155; stroke-width: 1.5; }
    .resp-line { stroke: #334155; stroke-width: 1.5; stroke-dasharray: 5 4; }
    
    .req-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; font-weight: 500; fill: #0f172a; text-anchor: middle; }
    .resp-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; font-weight: 400; fill: #334155; }
    
    .badge-201 { fill: #dcfce7; stroke: #86efac; stroke-width: 1; rx: 4; ry: 4; }
    .badge-201-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 700; fill: #166534; text-anchor: middle; }
    
    .badge-409 { fill: #fee2e2; stroke: #fca5a5; stroke-width: 1; rx: 4; ry: 4; }
    .badge-409-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 700; fill: #991b1b; text-anchor: middle; }
  </style>

  <!-- Clean Background -->
  <rect width="850" height="420" fill="#ffffff" />

  <!-- Lifelines -->
  <line x1="160" y1="70" x2="160" y2="350" class="lifeline" />
  <line x1="690" y1="70" x2="690" y2="350" class="lifeline" />

  <!-- Top Actors -->
  <g>
    <rect x="60" y="20" width="200" height="50" class="actor-card" />
    <text x="160" y="41" class="actor-title">Seu Sistema</text>
    <text x="160" y="57" class="actor-sub">Game Provider (Cliente)</text>

    <rect x="590" y="20" width="200" height="50" class="actor-card" />
    <text x="690" y="41" class="actor-title">Wagering Public API</text>
    <text x="690" y="57" class="actor-sub">Distributed Gateway (Servidor)</text>
  </g>

  <!-- ================= SCENARIO 1: OPEN WALLET ================= -->
  <rect x="290" y="90" width="270" height="22" class="divider-pill" />
  <text x="425" y="105" class="divider-text">1. Abertura de Carteira com Saldo Inicial</text>

  <!-- Step 1 Request -->
  <text x="425" y="132" class="req-text">POST /v1/api/wallets (playerId: "player-100", currency: "BRL", initialBalance: "500.00")</text>
  <line x1="160" y1="140" x2="682" y2="140" class="req-line" marker-end="url(#wf-req-arrow)" />

  <!-- Step 1 Response -->
  <g transform="translate(180, 162)">
    <rect x="0" y="0" width="90" height="20" class="badge-201" />
    <text x="45" y="14" class="badge-201-txt">201 CREATED</text>
    <text x="100" y="14" class="resp-text">Carteira aberta • version: 1 • genesis ledger entry gerado</text>
  </g>
  <line x1="690" y1="190" x2="168" y2="190" class="resp-line" marker-end="url(#wf-resp-arrow)" />

  <!-- ================= SCENARIO 2: DUPLICATE CONFLICT ================= -->
  <rect x="285" y="220" width="280" height="22" class="divider-pill" />
  <text x="425" y="235" class="divider-text">2. Tentativa Duplicada (Conflito de Unicidade)</text>

  <!-- Step 2 Request -->
  <text x="425" y="262" class="req-text">POST /v1/api/wallets (mesmo playerId e moeda BRL já cadastrados)</text>
  <line x1="160" y1="270" x2="682" y2="270" class="req-line" marker-end="url(#wf-req-arrow)" />

  <!-- Step 2 Response -->
  <g transform="translate(200, 292)">
    <rect x="0" y="0" width="90" height="20" class="badge-409" />
    <text x="45" y="14" class="badge-409-txt">409 CONFLICT</text>
    <text x="100" y="14" class="resp-text">error: WALLET_ALREADY_EXISTS (unicidade protegida no PostgreSQL)</text>
  </g>
  <line x1="690" y1="320" x2="168" y2="320" class="resp-line" marker-end="url(#wf-resp-arrow)" />

  <!-- Bottom Actors -->
  <g>
    <rect x="60" y="350" width="200" height="50" class="actor-card" />
    <text x="160" y="371" class="actor-title">Seu Sistema</text>
    <text x="160" y="387" class="actor-sub">Game Provider (Cliente)</text>

    <rect x="590" y="350" width="200" height="50" class="actor-card" />
    <text x="690" y="371" class="actor-title">Wagering Public API</text>
    <text x="690" y="387" class="actor-sub">Distributed Gateway (Servidor)</text>
  </g>
</svg>
