<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <defs>
    <marker id="wf-req-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1E293B" />
    </marker>
    <marker id="wf-resp-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#475569" />
    </marker>
    <filter id="actor-shadow" x="-5%" y="-10%" width="110%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.06" />
    </filter>
  </defs>

  <style>
    .actor-box { fill: #F8FAFC; stroke: #CBD5E1; stroke-width: 1.5; rx: 6; ry: 6; filter: url(#actor-shadow); }
    .actor-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 13.5px; font-weight: 600; fill: #0F172A; text-anchor: middle; }
    .actor-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 11px; font-weight: 400; fill: #64748B; text-anchor: middle; }
    .lifeline { stroke: #CBD5E1; stroke-width: 1.5; stroke-dasharray: 4 4; }
    
    .req-line { stroke: #1E293B; stroke-width: 1.5; }
    .resp-line { stroke: #475569; stroke-width: 1.5; stroke-dasharray: 5 4; }
    
    .msg-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 11.5px; fill: #1E293B; text-anchor: middle; }
    .verb-post { font-weight: 700; fill: #0F172A; }
    .verb-get { font-weight: 700; fill: #0369A1; }
    .status-201 { font-weight: 700; fill: #15803D; }
    .status-200 { font-weight: 700; fill: #0369A1; }
    .status-409 { font-weight: 700; fill: #DC2626; }
    .status-text { font-weight: 500; fill: #334155; }
  </style>

  <!-- Clean Background Canvas -->
  <rect width="850" height="420" fill="#FFFFFF" />

  <!-- Vertical Lifelines -->
  <line x1="160" y1="68" x2="160" y2="350" class="lifeline" />
  <line x1="690" y1="68" x2="690" y2="350" class="lifeline" />

  <!-- Top Actors -->
  <g>
    <rect x="50" y="18" width="220" height="50" class="actor-box" />
    <text x="160" y="39" class="actor-title">Seu sistema</text>
    <text x="160" y="55" class="actor-sub">Game Provider (Cliente)</text>

    <rect x="580" y="18" width="220" height="50" class="actor-box" />
    <text x="690" y="39" class="actor-title">Wagering Public API</text>
    <text x="690" y="55" class="actor-sub">Gateway Distribuído (Servidor)</text>
  </g>

  <!-- Step 1: Open Wallet -->
  <text x="425" y="104" class="msg-text">
    <tspan class="verb-post">POST</tspan> /v1/api/wallets (playerId: "player-100", currency: "BRL", initialBalance: "500.00")
  </text>
  <line x1="160" y1="112" x2="682" y2="112" class="req-line" marker-end="url(#wf-req-arrow)" />

  <text x="425" y="146" class="msg-text">
    <tspan class="status-201">201 Created</tspan> — <tspan class="status-text">carteira aberta (walletId gerado, saldo: "500.00", version: 1)</tspan>
  </text>
  <line x1="690" y1="154" x2="168" y2="154" class="resp-line" marker-end="url(#wf-resp-arrow)" />

  <!-- Step 2: Get Wallet Balance -->
  <text x="425" y="196" class="msg-text">
    <tspan class="verb-get">GET</tspan> /v1/api/wallets/{id} (consulta de saldo e versão antes de iniciar apostas)
  </text>
  <line x1="160" y1="204" x2="682" y2="204" class="req-line" marker-end="url(#wf-req-arrow)" />

  <text x="425" y="238" class="msg-text">
    <tspan class="status-200">200 OK</tspan> — <tspan class="status-text">detalhes da carteira (balance: "500.00", version: 1)</tspan>
  </text>
  <line x1="690" y1="246" x2="168" y2="246" class="resp-line" marker-end="url(#wf-resp-arrow)" />

  <!-- Step 3: Duplicate Conflict -->
  <text x="425" y="288" class="msg-text">
    <tspan class="verb-post">POST</tspan> /v1/api/wallets (mesmo playerId e moeda BRL já cadastrados)
  </text>
  <line x1="160" y1="296" x2="682" y2="296" class="req-line" marker-end="url(#wf-req-arrow)" />

  <text x="425" y="330" class="msg-text">
    <tspan class="status-409">409 Conflict</tspan> — <tspan class="status-text">unicidade violada (error: WALLET_ALREADY_EXISTS)</tspan>
  </text>
  <line x1="690" y1="338" x2="168" y2="338" class="resp-line" marker-end="url(#wf-resp-arrow)" />

  <!-- Bottom Actors -->
  <g>
    <rect x="50" y="350" width="220" height="50" class="actor-box" />
    <text x="160" y="371" class="actor-title">Seu sistema</text>
    <text x="160" y="387" class="actor-sub">Game Provider (Cliente)</text>

    <rect x="580" y="350" width="220" height="50" class="actor-box" />
    <text x="690" y="371" class="actor-title">Wagering Public API</text>
    <text x="690" y="387" class="actor-sub">Gateway Distribuído (Servidor)</text>
  </g>
</svg>
