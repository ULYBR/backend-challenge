{{- if .Values.serviceAccount.api.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "wagering.fullname" . }}-api
  labels:
    {{- include "wagering.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  {{- with .Values.serviceAccount.api.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
---
{{- if .Values.serviceAccount.consumer.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "wagering.fullname" . }}-consumer
  labels:
    {{- include "wagering.labels" . | nindent 4 }}
    app.kubernetes.io/component: consumer
  {{- with .Values.serviceAccount.consumer.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
---
{{- if .Values.serviceAccount.outbox.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "wagering.fullname" . }}-outbox
  labels:
    {{- include "wagering.labels" . | nindent 4 }}
    app.kubernetes.io/component: outbox
  {{- with .Values.serviceAccount.outbox.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
---
{{- if .Values.serviceAccount.scheduler.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "wagering.fullname" . }}-scheduler
  labels:
    {{- include "wagering.labels" . | nindent 4 }}
    app.kubernetes.io/component: scheduler
  {{- with .Values.serviceAccount.scheduler.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}

