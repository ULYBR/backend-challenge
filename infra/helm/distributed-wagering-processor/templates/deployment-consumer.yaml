apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wagering.fullname" . }}-consumer
  labels:
    {{- include "wagering.labels" . | nindent 4 }}
    app.kubernetes.io/component: consumer
spec:
  replicas: {{ .Values.consumer.replicaCount }}
  selector:
    matchLabels:
      {{- include "wagering.labels" . | nindent 6 }}
      app.kubernetes.io/component: consumer
  template:
    metadata:
      labels:
        {{- include "wagering.labels" . | nindent 8 }}
        app.kubernetes.io/component: consumer
    spec:
      serviceAccountName: {{ include "wagering.fullname" . }}-consumer
      containers:
        - name: consumer
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: APP_ROLE
              value: "consumer"
            - name: INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "wagering.fullname" . }}-secret
                  key: DB_PASSWORD
          envFrom:
            - configMapRef:
                name: {{ include "wagering.fullname" . }}-config
          resources:
            {{- toYaml .Values.consumer.resources | nindent 12 }}

