apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: wagering-processor-project
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: GitOps Project for Distributed Wagering Processor microservices
  sourceRepos:
    - "*"
  destinations:
    - namespace: wagering
      server: https://kubernetes.default.svc
    - namespace: wagering-staging
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"

